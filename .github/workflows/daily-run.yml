name: Auto‑log Demo

on:
  push:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write log file
        run: |
          echo "Run at $(date)" >> runlog.txt

      - name: Commit & Push
        run: |
          git config user.name "github‑actions[bot]"
          git config user.email "github‑actions[bot]@users.noreply.github.com"
          git add runlog.txt
          git commit -m "Auto log update"
          git push
